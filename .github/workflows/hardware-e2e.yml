name: hardware-e2e

on:
  # Manual trigger: choose any image and optional subset of tests.
  workflow_dispatch:
    inputs:
      image:
        description: >
          Image to test. A bare tag (e.g. sha-7d3adda) resolves against
          ghcr.io/openuc2/imswitch; a full ref (repo/image:tag) is used as-is.
        required: true
      tests:
        description: >
          Space-separated e2e folders to run (e.g. "board firmware"). Empty
          runs the whole suite, including motor/camera/laser/ledmatrix.
        required: false
        default: ""

  # Automatic trigger: explicitly mark a commit for hardware testing.
  push:
    tags:
      - "hardware-test-*"

# One rig, one run.
concurrency:
  group: hardware-e2e-${{ github.repository }}
  cancel-in-progress: false

jobs:
  test-on-rig:
    runs-on: [self-hosted, uc2-rig]

    steps:
      - uses: actions/checkout@v4

      - name: Determine image and tests
        id: config
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            IMAGE="${{ inputs.image }}"
            TESTS="${{ inputs.tests }}"
          else
            SHORT_SHA="${GITHUB_SHA::7}"
            IMAGE="sha-${SHORT_SHA}"
            TESTS=""
          fi

          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "tests=$TESTS" >> "$GITHUB_OUTPUT"

          echo "Image to test: $IMAGE"
          echo "Tests: ${TESTS:-all}"

      - name: Run the e2e suite against the image under test
        id: hil
        working-directory: imswitch/imcontrol/_test/e2e
        run: |
          ci/hil-run.sh \
            --image "${{ steps.config.outputs.image }}" \
            --yes \
            --out ci/reports \
            --tests "${{ steps.config.outputs.tests }}"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hil-report-${{ steps.config.outputs.image }}
          path: imswitch/imcontrol/_test/e2e/ci/reports/
          if-no-files-found: warn
          retention-days: 30
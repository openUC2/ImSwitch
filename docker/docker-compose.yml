services:
  imswitch-docker-noqt:
    image: ghcr.io/openuc2/imswitch-noqt:sha-540a0a6
    privileged: true
    ports:
      - "8001:8001" # frontend, HTTP API, WebSockets API
      - "8888:8888" # Jupyter
    volumes:
      - /etc/machine-id:/etc/machine-id:ro
      - /home/pi/ImSwitchConfig:/home/pi/ImSwitchConfig
      - /home/pi/Datasets:/home/pi/Datasets
      #- /Users/bene/ImSwitchConfig:/home/pi/ImSwitchConfig
      #- /Users/bene/ImSwitchConfig/Datasets:/home/pi/Datasets
      #- /Volumes:/media
      - /media:/media
      # Drop-in plugins: one subdirectory per plugin, each containing a Python
      # package with register(). Read-only on purpose — anything that can write
      # here runs arbitrary Python in the microscope process and arbitrary
      # JavaScript in the operator's browser. See docs/plugins/DEPLOYMENT.md.
      - /home/pi/ImSwitchPlugins:/opt/imswitch/plugins:ro
      - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket
      - /run/udev:/run/udev:ro
      - /dev/dma_heap:/dev/dma_heap

    environment:
      - HEADLESS=1
      - HTTP_PORT=8001
      - JUPYTER_PORT=8888
      - CONFIG_PATH=/home/pi/ImSwitchConfig
      - UPDATE_GIT=0
      - UPDATE_CONFIG=0
      - DATA_PATH=/home/pi/Datasets
      - SCAN_EXT_DATA_PATH=1
      - EXT_DATA_PATH=/media
      - SSL=0
      # Exported to the app as IMSWITCH_PLUGIN_DIR by the entrypoint.
      - PLUGIN_PATH=/opt/imswitch/plugins
    restart: always

  volume-setup:
    # This service ensures that root isn't the owner of /home/pi/Datasets, since Docker auto-creates
    # that path if it didn't exist before for the bind mount, and Docker creates such directories
    # with root ownership.
    image: docker.io/library/alpine:3.22.2@sha256:4b7ce07002c69e8f3d704a9c5d6fd3053be500b7f1c69fc0d80990c2ad8dd412
    volumes:
      #- /Users/bene/ImSwitchConfig/Datasets:/home/pi/Datasets
      - /home/pi/ImSwitchConfig/Datasets:/home/pi/Datasets
      # Docker auto-creates a missing bind-mount source as root-owned. The
      # plugin directory is mounted read-only, so ownership does not affect the
      # server — but creating it here means the operator sees an empty
      # directory to drop plugins into rather than having to guess the path.
      - /home/pi/ImSwitchPlugins:/home/pi/ImSwitchPlugins
    command: 'sh -c "chown -R 1000:1000 /home/pi/Datasets /home/pi/ImSwitchPlugins; sleep 60"'

# ─────────────────────────────────────────────────────────────────────────────
#  ALTERNATIVE PLUGIN DELIVERY: a container image used as a volume source.
#
#  The bind mount above is right for development and for a single
#  self-hosted instrument: you rsync a directory and restart.
#
#  This second pattern is right for a fleet, where you want the plugin version
#  pinned in the same file as everything else and rolled out by digest rather
#  than by whoever last ran rsync. The plugin image is FROM scratch — it holds
#  the plugin tree and nothing else — and simply copies itself into a named
#  volume before the server starts.
#
#  Do not use both for the same plugin: a bind mount over /opt/imswitch/plugins
#  hides the named volume.
#
#  services:
#    plugin-goniometer:
#      image: ghcr.io/openuc2/imswitch-plugin-goniometer:0.2.0
#      volumes:
#        - plugins:/out

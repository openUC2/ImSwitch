<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 620" font-family="ui-sans-serif, system-ui, sans-serif">
  <!-- CONFIG-MODEL.md §5 — the identity space. Every arrow is a typed reference
       that must resolve at load. Colour = which layer owns the arrow's source. -->
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#16a34a"/>
    </marker>
    <marker id="ay" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#ca8a04"/>
    </marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9333ea"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1020" height="620" fill="#ffffff"/>

  <text x="510" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">The identity space — who may name whom</text>
  <text x="510" y="54" text-anchor="middle" font-size="12.5" fill="#64748b">a reference that does not resolve is a boot failure, not a warning</text>

  <!-- design column -->
  <rect x="34" y="82" width="290" height="470" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.4"/>
  <text x="179" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">L1 · instrument.dsn (optikit)</text>

  <rect x="58" y="122" width="242" height="52" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="72" y="142" font-size="12.5" font-weight="700" fill="#0f172a">ComponentRef</text>
  <text x="72" y="160" font-size="10.5" font-family="ui-monospace, monospace" fill="#334155">"objective", "dichroic", "camera"</text>

  <rect x="58" y="190" width="242" height="52" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="72" y="210" font-size="12.5" font-weight="700" fill="#0f172a">DofRef</text>
  <text x="72" y="228" font-size="11.5" font-family="ui-monospace, monospace" fill="#334155">"objective.dz"  ← the motion</text>

  <rect x="58" y="258" width="242" height="52" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="72" y="278" font-size="12.5" font-weight="700" fill="#0f172a">PortRef</text>
  <text x="72" y="296" font-size="11.5" font-family="ui-monospace, monospace" fill="#334155">"dichroic.reflected"</text>

  <rect x="58" y="326" width="242" height="52" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="72" y="346" font-size="12.5" font-weight="700" fill="#0f172a">PathRef</text>
  <text x="72" y="364" font-size="11.5" font-family="ui-monospace, monospace" fill="#334155">"excitation", "emission"</text>

  <rect x="58" y="394" width="242" height="52" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="72" y="414" font-size="12.5" font-weight="700" fill="#0f172a">VariantRef</text>
  <text x="72" y="432" font-size="11.5" font-family="ui-monospace, monospace" fill="#334155">"obj_20x", "filter_gfp"</text>

  <rect x="58" y="462" width="242" height="66" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="72" y="482" font-size="12.5" font-weight="700" fill="#334155">pose · grid 50/50/55 mm</text>
  <text x="72" y="500" font-size="11.5" fill="#475569">the cube arrangement — read only,</text>
  <text x="72" y="516" font-size="11.5" fill="#475569">the source of every affine matrix</text>

  <!-- bindings column -->
  <rect x="364" y="82" width="290" height="470" rx="12" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.4"/>
  <text x="509" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">L2 · bindings.yml (newswitch)</text>

  <rect x="388" y="122" width="242" height="52" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="402" y="142" font-size="12.5" font-weight="700" fill="#0f172a">TransportRef</text>
  <text x="402" y="160" font-size="11.5" font-family="ui-monospace, monospace" fill="#334155">"main"  (CANopen / REST / virtual)</text>

  <rect x="388" y="190" width="242" height="86" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="402" y="210" font-size="12.5" font-weight="700" fill="#0f172a">DeviceRef</text>
  <text x="402" y="228" font-size="11.5" font-family="ui-monospace, monospace" fill="#334155">"stage.xyz", "camera.main"</text>
  <text x="402" y="248" font-size="11.5" fill="#334155">driver key + typed params + roles</text>
  <text x="402" y="266" font-size="11.5" fill="#334155">+ <tspan font-family="ui-monospace, monospace">mounts</tspan> / <tspan font-family="ui-monospace, monospace">drives</tspan> / <tspan font-family="ui-monospace, monospace">selects</tspan></text>

  <rect x="388" y="292" width="242" height="66" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="402" y="312" font-size="12.5" font-weight="700" fill="#0f172a">AxisRef</text>
  <text x="402" y="330" font-size="11.5" font-family="ui-monospace, monospace" fill="#334155">"stage.xyz:Z"</text>
  <text x="402" y="348" font-size="11.5" fill="#334155">one axis drives exactly one DOF</text>

  <rect x="388" y="374" width="242" height="66" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="402" y="394" font-size="12.5" font-weight="700" fill="#0f172a">SlotRef</text>
  <text x="402" y="412" font-size="11.5" font-family="ui-monospace, monospace" fill="#334155">"turret.objective:2"</text>
  <text x="402" y="430" font-size="11.5" fill="#334155">a slot selects a design variant</text>

  <!-- profile column -->
  <rect x="694" y="82" width="292" height="470" rx="12" fill="#fefce8" stroke="#fef08a" stroke-width="1.4"/>
  <text x="840" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#713f12">L3 · profile/ + L4 · calibration/</text>

  <rect x="718" y="122" width="244" height="104" rx="8" fill="#ffffff" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="732" y="142" font-size="12.5" font-weight="700" fill="#0f172a">Channel</text>
  <text x="732" y="160" font-size="11.5" fill="#334155">→ <tspan font-family="ui-monospace, monospace">path</tspan> (which beam it uses)</text>
  <text x="732" y="178" font-size="11.5" fill="#334155">→ <tspan font-family="ui-monospace, monospace">illumination.device</tspan> + intensity</text>
  <text x="732" y="196" font-size="11.5" fill="#334155">→ <tspan font-family="ui-monospace, monospace">camera.device</tspan> + exposure, gain</text>
  <text x="732" y="214" font-size="11.5" fill="#334155">→ <tspan font-family="ui-monospace, monospace">selectors</tspan> {device: slot}</text>

  <rect x="718" y="242" width="244" height="66" rx="8" fill="#ffffff" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="732" y="262" font-size="12.5" font-weight="700" fill="#0f172a">ObjectiveOverride</text>
  <text x="732" y="280" font-size="11.5" fill="#334155">keyed by the turret slot's variant —</text>
  <text x="732" y="298" font-size="11.5" fill="#334155">not by a free-text "20x" string</text>

  <rect x="718" y="352" width="244" height="140" rx="8" fill="#faf5ff" stroke="#9333ea" stroke-width="1.5"/>
  <text x="732" y="374" font-size="12.5" font-weight="700" fill="#0f172a">CalibrationEntry</text>
  <text x="732" y="394" font-size="11.5" fill="#334155">keyed by <tspan font-family="ui-monospace, monospace" font-weight="700">path_hash</tspan> — the tuple of</text>
  <text x="732" y="412" font-size="11.5" fill="#334155">design sha, active variants, selector</text>
  <text x="732" y="430" font-size="11.5" fill="#334155">slots and quantised DOF values.</text>
  <text x="732" y="454" font-size="11.5" fill="#475569">Change any of them and the key changes;</text>
  <text x="732" y="472" font-size="11.5" fill="#475569">a calibration can never silently apply</text>
  <text x="732" y="486" font-size="11.5" fill="#475569">to a geometry it was not measured on.</text>

  <!-- arrows: bindings → design -->
  <path d="M388 148 C 350 148, 340 148, 302 148" stroke="#16a34a" stroke-width="1.5" fill="none" marker-end="url(#ag)"/>
  <path d="M388 216 C 350 200, 340 160, 302 152" stroke="#16a34a" stroke-width="1.5" fill="none" marker-end="url(#ag)"/>
  <text x="345" y="188" text-anchor="middle" font-size="10.5" font-style="italic" fill="#16a34a">mounts</text>
  <path d="M388 326 C 350 320, 340 224, 302 218" stroke="#16a34a" stroke-width="1.8" fill="none" marker-end="url(#ag)"/>
  <text x="345" y="272" text-anchor="middle" font-size="10.5" font-weight="700" font-style="italic" fill="#15803d">drives</text>
  <path d="M388 408 C 350 408, 340 420, 302 420" stroke="#16a34a" stroke-width="1.5" fill="none" marker-end="url(#ag)"/>
  <text x="345" y="404" text-anchor="middle" font-size="10.5" font-style="italic" fill="#16a34a">selects</text>

  <!-- arrows: profile → bindings & design -->
  <path d="M718 182 C 680 182, 668 232, 632 232" stroke="#ca8a04" stroke-width="1.5" fill="none" marker-end="url(#ay)"/>
  <path d="M718 208 C 680 300, 668 404, 632 406" stroke="#ca8a04" stroke-width="1.5" fill="none" marker-end="url(#ay)"/>
  <path d="M714 222 C 672 250, 662 320, 662 462 L 350 462 C 332 462, 340 396, 312 358" stroke="#ca8a04" stroke-width="1.7" fill="none" marker-end="url(#ay)"/>
  <text x="506" y="482" text-anchor="middle" font-size="11" font-weight="700" font-style="italic" fill="#a16207">a channel names a design path — so the optics can be checked against the settings</text>

  <path d="M840 492 C 840 540, 700 560, 560 540" stroke="#9333ea" stroke-width="1.4" fill="none" stroke-dasharray="5 4" marker-end="url(#ap)"/>
  <text x="440" y="556" text-anchor="middle" font-size="11.5" font-style="italic" fill="#7e22ce">calibration keys are computed, never typed — §6</text>

  <text x="510" y="600" text-anchor="middle" font-size="12" fill="#475569">The one rule that makes the rest work: <tspan font-weight="700" fill="#0f172a">a lower layer never restates a fact the layer below it owns.</tspan> Wavelength, NA, focal length and filter band come from L1, always.</text>
</svg>

[pytest]
# The HIL suite is its own pytest project, so pytest does not import the ImSwitch packages above.
# console_output_style = count shows "[12/31]" after each test, the number of tests done.
# The default is a percentage, which reads as time.
# That misleads here: the calibration is the last 2 tests and most of the run.
addopts = -p no:arkitekt_next -p no:cacheprovider -v --tb=short
console_output_style = count
markers =
    hardware: needs a real rig; conftest.py sets it on every HIL test
